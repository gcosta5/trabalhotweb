<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIXT</title>
    <link rel="stylesheet" href="pagina.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">

</head>
<body>


    <div class="topbar">
        113 anos de SIXT. 113 anos de tradição.
    </div>


    <header class="header">
        <div class="header-container">

            <div class="header-left">
                <button class="hamburger" id="hamburger">☰</button>
                <img src="imagens/SIXT_Logo-frame.565790a1.png" alt="SIXT" class="logo">

            </div>

            <!-- MENU SANDWICH 
            <nav class="side-menu" id="side-menu">
                <ul>
                    <li><a href="#">Aluguer de longa duração</a></li>
                    <li><a href="#">SIXT ride</a></li>
                    <li><a href="#">Empresas</a></li>
                    <li><a href="#">Ajuda</a></li>
                </ul>
            </nav>
            -->

          <div class="header-right">

    <div class="header-item">
        <img src="imagens/carro branco.removebg-preview.png" alt="">
        <span>Gerir as Reservas</span>
    </div>

    <div class="header-item">
        <img src="imagens/worldw-removebg-preview.png" alt="">
        <span>PT | €</span>
    </div>

    <div class="header-item">
        <img src="imagens/pessoa-removebg-preview.png" alt="">
        <span>Iniciar Sessão | Registar</span>
    </div>

</div>
        </div>
    </header>

    
    <section class="hero">
        <!-- WIDGET -->
        <div class="booking-box">

            <div class="tabs">
                <button class="tab carros active" > Carros</button>
                <button class="tab carrinhas" >Carrinhas</button>
            </div>

            <form class="booking-form">

    <!-- Campo de localização (mantido igual) -->
    <div class="field field-location">
        <label>Levantamento e devolução</label>
        <div class="field-main icon-lupa">
            <input type="text" placeholder="Aeroporto, cidade ou endereço">
            <span class="clear">X</span>
        </div>
    </div>

    <!-- Link de devolução diferente (movido para baixo do campo de localização) -->
    <div class="diff-return">
        <span class="mais">+</span>
        <span>Local de devolução diferente</span>
    </div>

    <!-- Data de recolha -->
    <div class="field field-date-group">
        <label>Data de recolha</label>
        <input type="date" class="field-date">
        <input type="time" class="field-time">
    </div>

    <!-- Data de devolução -->
    <div class="field field-date-group">
        <label>Data de devolução</label>
        <input type="date" class="field-date">
        <input type="time" class="field-time">
    </div>

    <!-- Botão -->
    <div class="field field-button">
        <button type="button">Mostrar veículos</button>
    </div>

</form>
            <div class="enterprise-link">
                Aplicar a tarifa empresarial
            </div>

        </div>
    </section>

    <!-- HEADLINE -->
    <section class="headline">
        <h1>
            DON'T RENT A CAR.<br>
            RENT THE CAR.
        </h1>
    </section>

    <!-- PROMO -->
    <section class="promo">
        <div class="promo-grid">
            <div class="promo-card promo-main"></div>
            <div class="promo-card card2"></div>
            <div class="promo-card card3"></div>
        </div>
    </section>

    <footer class="footer">
        © SIXT 2025
    </footer>

    <script src="logica.js"></script>
</body>
</html>
